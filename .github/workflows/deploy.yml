name: Deploy
on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  deploy:
    runs-on: [self-hosted, tzer0m]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Stop service
        run: sudo systemctl stop PersonalSite.service
      - name: Publish
        run: dotnet publish PersonalSite/PersonalSite.csproj -c Release -o /home/tzer0m/Services/PersonalSite
      - name: Start service
        run: sudo systemctl start PersonalSite.service
      - name: Check status
        run: sudo systemctl status PersonalSite.service --no-pager
